<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#060911" />
    <meta name="description" content="Da Hora Motos Elétricas — Motos, scooters e veículos elétricos. Economia, tecnologia e praticidade para sua rotina." />
    <meta property="og:title" content="Da Hora Motos Elétricas" />
    <meta property="og:description" content="Motos, scooters e veículos elétricos para transformar sua rotina." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <title>Da Hora Motos Elétricas | Motos e Scooters Elétricas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root">
      <!-- Fallback de carregamento inicial enquanto o bundle React é parseado -->
      <div style="min-height: 100vh; background-color: #060911; color: white; display: flex; align-items: center; justify-content: center; font-family: system-ui, -apple-system, sans-serif;">
        <div style="text-align: center; padding: 20px;">
          <div style="width: 48px; height: 48px; border: 3px solid rgba(16, 185, 129, 0.2); border-top-color: #10B981; border-radius: 50%; margin: 0 auto 16px auto; animation: spin 1s linear infinite;"></div>
          <h2 style="font-size: 18px; font-weight: 700; margin-bottom: 6px;">DA HORA MOTOS ELÉTRICAS</h2>
          <p style="font-size: 12px; color: #94A3B8;">Carregando concessionária digital...</p>
        </div>
      </div>
      <style>
        @keyframes spin {
          to { transform: rotate(360deg); }
        }
      </style>
    </div>

    <!-- Detector de erros em tempo real no navegador -->
    <script>
      window.addEventListener('error', function(event) {
        var errBox = document.getElementById('runtime-error-banner');
        if (!errBox) {
          errBox = document.createElement('div');
          errBox.id = 'runtime-error-banner';
          errBox.style.cssText = 'position:fixed;bottom:20px;left:20px;right:20px;max-width:600px;margin:0 auto;background:#7f1d1d;color:#fecaca;border:1px solid #ef4444;border-radius:12px;padding:16px;z-index:9999999;font-family:monospace;font-size:12px;box-shadow:0 10px 25px rgba(0,0,0,0.5);white-space:pre-wrap;';
          document.body.appendChild(errBox);
        }
        errBox.textContent = '⚠️ Erro de Execução no Navegador:\n' + (event.message || event.error) + '\nArquivo: ' + (event.filename || '') + ' Linha: ' + (event.lineno || '');
      });
      window.addEventListener('unhandledrejection', function(event) {
        var errBox = document.getElementById('runtime-error-banner');
        if (!errBox) {
          errBox = document.createElement('div');
          errBox.id = 'runtime-error-banner';
          errBox.style.cssText = 'position:fixed;bottom:20px;left:20px;right:20px;max-width:600px;margin:0 auto;background:#7f1d1d;color:#fecaca;border:1px solid #ef4444;border-radius:12px;padding:16px;z-index:9999999;font-family:monospace;font-size:12px;box-shadow:0 10px 25px rgba(0,0,0,0.5);white-space:pre-wrap;';
          document.body.appendChild(errBox);
        }
        var msg = event.reason ? (event.reason.stack || event.reason.message || event.reason) : 'Promise rejeitada';
        errBox.textContent = '⚠️ Erro Assíncrono no Navegador:\n' + msg;
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
